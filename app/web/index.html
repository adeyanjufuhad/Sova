<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Records, reminders and receipts for ajo, esusu and adashe circles.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="sova">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sova</title>
  <link rel="manifest" href="manifest.json">

  <!-- Shown while main.dart.js downloads (about 3.4 MB); removed on Flutter's first frame. -->
  <style>
    body { margin: 0; background: #FFFFFF; }
    #sova-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 0 16px;
      background: #FFFFFF;
      color: #0B1A33;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    #sova-loading img { width: 56px; height: 56px; border-radius: 12px; }
    #sova-loading p { margin: 0; }
    #sova-loading .title { font-size: 18px; font-weight: 600; }
    #sova-loading .note { font-size: 14px; color: #475569; }
    /* Newton's cradle, adapted from "newtons-cradle" by dovatgabriel on
       Uiverse.io (MIT); the app's SovaLoader draws the same thing. */
    .cradle { display: flex; width: 48px; height: 48px; margin-top: 8px; }
    .cradle span {
      display: flex;
      align-items: center;
      width: 25%;
      height: 100%;
      transform-origin: center top;
    }
    .cradle span::after {
      content: "";
      width: 100%;
      height: 25%;
      border-radius: 50%;
      background: #1D4ED8;
    }
    .cradle span:first-child { animation: sova-swing 1.2s linear infinite; }
    .cradle span:last-child { animation: sova-swing-back 1.2s linear infinite; }
    @keyframes sova-swing {
      0% { transform: rotate(0deg); animation-timing-function: ease-out; }
      25% { transform: rotate(70deg); animation-timing-function: ease-in; }
      50% { transform: rotate(0deg); animation-timing-function: linear; }
    }
    @keyframes sova-swing-back {
      0% { transform: rotate(0deg); animation-timing-function: linear; }
      50% { transform: rotate(0deg); animation-timing-function: ease-out; }
      75% { transform: rotate(-70deg); animation-timing-function: ease-in; }
    }
    @media (prefers-reduced-motion: reduce) {
      .cradle span { animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="sova-loading" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <p class="title">Loading Sova…</p>
    <p class="note">The first visit takes a few seconds.</p>
    <div class="cradle" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('sova-loading');
      if (el) el.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
