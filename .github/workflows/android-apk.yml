# Builds the Android app (APK) against the live API and attaches it to a
# GitHub Release, so anyone can install Sova on an Android phone.
#   - Push a tag like v1.0.0: a release with that name gets the APK.
#   - Run it by hand: the APK is kept as a workflow artifact for 14 days.
# Signing: with the four ANDROID_* secrets set (see app/README.md) the APK is
# signed with the upload key; without them it is signed with a throwaway debug
# key, which installs fine but can't be updated in place by a later signed build.
name: Android APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SOVA_API_URL: ${{ vars.SOVA_API_URL || 'https://sova-api.rumptycloud.app' }}
      SOVA_SITE_URL: ${{ vars.SITE_URL || 'https://sova.rumptycloud.app' }}
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.7
          cache: true

      - name: Test
        working-directory: app
        run: |
          flutter pub get
          flutter test

      - name: Signing key
        if: env.KEYSTORE_BASE64 != ''
        working-directory: app/android
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > key.properties

      - name: Build
        working-directory: app
        run: |
          flutter build apk --release --dart-define=SOVA_API_URL="$SOVA_API_URL" --dart-define=SOVA_SITE_URL="$SOVA_SITE_URL"
          mv build/app/outputs/flutter-apk/app-release.apk "build/sova-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: sova-apk
          path: app/build/sova-*.apk
          retention-days: 14

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then signing="Signed with the Sova upload key."; else signing="Signed with a debug key (no release key configured yet): uninstall it before installing a later signed build."; fi
          notes="Sova for Android, built from ${GITHUB_SHA::7} against ${SOVA_API_URL}. Tap \"Try the demo\" to look around. ${signing} Sova keeps records only: it never holds or moves money."
          gh release create "$GITHUB_REF_NAME" app/build/sova-*.apk --title "Sova $GITHUB_REF_NAME" --notes "$notes" \
            || gh release upload "$GITHUB_REF_NAME" app/build/sova-*.apk --clobber
