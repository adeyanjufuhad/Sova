# Builds the website as static files and publishes them to the `site-web`
# branch, which RumptyCloud serves as a static site. Public addresses come
# from repository variables, with the RumptyCloud defaults as fallback.
name: Website build

on:
  push:
    branches: [main]
    paths: ["website/**", ".github/workflows/site-web.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-web
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL || 'https://sova.rumptycloud.app' }}
      NEXT_PUBLIC_APP_URL: ${{ vars.APP_URL || 'https://sova-app.rumptycloud.app' }}
      NEXT_PUBLIC_API_URL: ${{ vars.SOVA_API_URL || 'https://sova-api.rumptycloud.app' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build
        working-directory: website
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Publish to the site-web branch
        working-directory: website/out
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b site-web
          git config user.name "github-actions[bot]"
          git config user.email "41898315+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Static build of ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site-web
